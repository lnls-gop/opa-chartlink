<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075985" />
    <title>Archiver Link Builder — Em desenvolvimento</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #e0f2fe, #f8fafc 55%); color: #0f172a; }
      main { width: min(620px, 100%); padding: 42px; border: 1px solid rgba(14, 165, 233, .25); border-radius: 26px; background: rgba(255, 255, 255, .88); box-shadow: 0 24px 70px rgba(15, 23, 42, .13); backdrop-filter: blur(12px); text-align: center; }
      .icon { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 22px; background: linear-gradient(135deg, #0284c7, #0f766e); color: white; font-size: 34px; box-shadow: 0 14px 30px rgba(2, 132, 199, .25); }
      .status { display: inline-block; padding: 6px 11px; border-radius: 999px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
      h1 { margin: 18px 0 10px; font-size: clamp(28px, 6vw, 42px); line-height: 1.05; }
      p { margin: 0 auto; max-width: 500px; color: #475569; font-size: 17px; line-height: 1.65; }
      a { display: inline-flex; margin-top: 28px; padding: 11px 17px; border-radius: 12px; background: #0369a1; color: white; font-size: 14px; font-weight: 750; text-decoration: none; }
      a:hover { background: #075985; }
      @media (prefers-color-scheme: dark) {
        body { background: radial-gradient(circle at top, #0c4a6e, #0f172a 58%); color: #f8fafc; }
        main { border-color: rgba(125, 211, 252, .25); background: rgba(15, 23, 42, .88); box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
        p { color: #cbd5e1; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⌁</div>
      <span class="status">Em desenvolvimento</span>
      <h1>Archiver Link Builder</h1>
      <p>Esta ferramenta será usada para montar, configurar e gerar links do Archiver Viewer de forma simples e organizada.</p>
      <a href="./">Voltar ao ChartLink</a>
    </main>
  </body>
</html>
