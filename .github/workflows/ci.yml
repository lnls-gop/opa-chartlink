name: Verificar ChartLink
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Preparar configuração temporária
        run: |
          cat > .env <<'ENV'
          CHARTLINK_DATA_DIR=${{ runner.temp }}/chartlink-data
          CHARTLINK_BACKUP_DIR=${{ runner.temp }}/chartlink-backups
          CHARTLINK_SECRET_KEY=ci-only-secret-key-that-is-not-used-in-production
          CHARTLINK_BIND_IP=127.0.0.1
          CHARTLINK_PORT=8080
          ENV
      - name: Validar containers e persistência após reinício
        run: |
          sh scripts/chartlink.sh build
          sh scripts/chartlink.sh init-empty
          sh scripts/chartlink.sh start
          python - <<'PYTEST'
          import http.cookiejar, json, urllib.request
          base='http://127.0.0.1:8080'
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          assert b'<div id="root">' in opener.open(base).read()
          auth=json.load(opener.open(base+'/api/auth/session'))
          body=json.dumps({'title':'CI persistence','url':'https://example.org'}).encode()
          req=urllib.request.Request(base+'/api/links',data=body,headers={
              'Content-Type':'application/json', 'X-CSRF-Token':auth['csrfToken']})
          assert opener.open(req).status==201
          PYTEST
          docker compose restart api
          docker compose up -d --wait
          python - <<'PYTEST'
          import json, urllib.request
          rows=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/links'))
          assert any(row['title']=='CI persistence' for row in rows)
          PYTEST
          sh scripts/chartlink.sh backup
      - name: Exportar imagens sem banco de dados
        run: |
          mkdir -p "${{ runner.temp }}/chartlink-images"
          docker image save --output "${{ runner.temp }}/chartlink-images/opa-chartlink-images.tar" opa-chartlink-api:1.0.8 opa-chartlink-web:1.0.8
          cd "${{ runner.temp }}/chartlink-images"
          sha256sum opa-chartlink-images.tar > SHA256SUMS
      - name: Disponibilizar imagens linux-amd64
        uses: actions/upload-artifact@v4
        with:
          name: opa-chartlink-1.0.8-linux-amd64
          path: ${{ runner.temp }}/chartlink-images/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Logs em caso de erro
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Encerrar containers temporários
        if: always()
        run: docker compose down
