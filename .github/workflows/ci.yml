name: Verificar ChartLink
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Preparar configuração temporária
        run: |
          cat > .env <<'ENV'
          CHARTLINK_DATA_DIR=${{ runner.temp }}/chartlink-data
          CHARTLINK_BACKUP_DIR=${{ runner.temp }}/chartlink-backups
          CHARTLINK_BIND_IP=127.0.0.1
          CHARTLINK_PORT=8080
          ENV
      - name: Validar containers e persistência após reinício
        run: |
          sh scripts/chartlink.sh init-empty
          sh scripts/chartlink.sh start
          python - <<'PYTEST'
          import json, urllib.request
          base='http://127.0.0.1:8080'
          assert b'<div id="root">' in urllib.request.urlopen(base).read()
          body=json.dumps({'title':'CI persistence','url':'https://example.org'}).encode()
          req=urllib.request.Request(base+'/api/links',data=body,headers={'Content-Type':'application/json'})
          assert urllib.request.urlopen(req).status==201
          PYTEST
          docker compose restart api
          docker compose up -d --wait
          python - <<'PYTEST'
          import json, urllib.request
          rows=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/links'))
          assert any(row['title']=='CI persistence' for row in rows)
          PYTEST
          sh scripts/chartlink.sh backup
      - name: Logs em caso de erro
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Encerrar containers temporários
        if: always()
        run: docker compose down
